services:
  grafana:
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-latest}
    ports:
      - 3000:3000/tcp

    environment:
      ACCESS_KEY: ${ACCESS_KEY}
      SECRET_KEY: ${SECRET_KEY}
      GF_AWS_ALLOWED_AUTH_PROVIDERS: default,keys,credentials,grafana_assume_role
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
